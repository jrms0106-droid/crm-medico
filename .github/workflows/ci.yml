name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, formatação e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_only
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://crm:crm_ci_only@localhost:5432/crm_test
      DATABASE_URL_TEST: postgresql://crm:crm_ci_only@localhost:5432/crm_test
      DATABASE_URL_APP: postgresql://crm_app:crm_app_ci_only@localhost:5432/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrações aplicam do zero
        run: npx prisma migrate status
      - name: Papel da aplicação sem poderes de dono
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/db/papel-aplicacao.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE crm_app PASSWORD 'crm_app_ci_only'"
          psql "$DATABASE_URL_APP" -v ON_ERROR_STOP=1 -f scripts/db/verificar-papel.sql
      - name: Navegador para os testes ponta a ponta
        run: npx playwright install --with-deps chromium
      - name: Testes ponta a ponta (Playwright), com a API no papel da aplicação
        run: npm run e2e
        env:
          E2E_API_DATABASE_URL: ${{ env.DATABASE_URL_APP }}
      - name: Ensaio de backup cifrado e restauração
        run: |
          sudo apt-get install -y age
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE crm_restore"
          SOURCE_DATABASE_URL="$DATABASE_URL" \
          RESTORE_DATABASE_URL="postgresql://crm:crm_ci_only@localhost:5432/crm_restore" \
            scripts/ops/ensaio-de-restauracao.sh
      - name: Rastros dos testes ponta a ponta que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rastros
          path: test-results/
          retention-days: 7

  seguranca:
    name: Dependências e segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Auditoria de vulnerabilidades (falha em alta ou crítica)
        run: npm audit --audit-level=high
      - name: Varredura de segredos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
